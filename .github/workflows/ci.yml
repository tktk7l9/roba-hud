name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build
        run: swift build
      - name: Selftest
        run: swift run RoBaHUD --selftest
      - name: Coverage gate (lib 100% lines)
        run: ./scripts/coverage-gate.sh
